name: EAS Build - Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        type: choice
        options:
          - android
          - ios
          - all
        default: 'android'
      profile:
        description: 'Build profile'
        type: choice
        options:
          - development
          - preview
          - production
        default: 'production'

env:
  PNPM_VERSION: '12.21.0'
  NODE_VERSION: '20'
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

jobs:
  eas-build-android:
    name: EAS Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' || github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: |
          eas build --platform android --profile ${{ github.event.inputs.profile || 'production' }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

      - name: Wait for build to complete
        id: wait-for-build
        run: |
          echo "Waiting for build to complete..."
          sleep 300
          echo "Build wait period completed"

  eas-build-ios:
    name: EAS Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        run: |
          eas build --platform ios --profile ${{ github.event.inputs.profile || 'production' }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

  download-apk:
    name: Download APK Artifact
    runs-on: ubuntu-latest
    needs: [eas-build-android]
    if: always() && needs.eas-build-android.result == 'success'
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: eas-build-android-apk
          path: ./apk

      - name: List APK
        run: ls -la ./apk/

      - name: Upload APK as release asset
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: BamanaShop Android APK #${{ github.run_number }}
          body: |
            BamanaShop Customer App - Android APK

            Built from commit: ${{ github.sha }}
            Build profile: ${{ github.event.inputs.profile || 'production' }}
            Build number: ${{ github.run_number }}

            ## Installation
            ```bash
            adb install bamanashop-android.apk
            ```
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [eas-build-android, eas-build-ios, download-apk]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Build Summary"
          echo ""
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| EAS Build Android | ${{ needs.eas-build-android.result }} |"
          echo "| EAS Build iOS | ${{ needs.eas-build-ios.result }} |"
          echo "| Download APK | ${{ needs.download-apk.result }} |"
          echo ""
          if [ "${{ needs.eas-build-android.result }}" == "success" ]; then
            echo "✅ Android APK build successful!"
            echo "📱 APK available as GitHub release asset or workflow artifact"
          fi