name: One-time domain test formatting repair

on:
  push:
    branches:
      - refactor/remove-expo-native-android

permissions:
  contents: write

jobs:
  format-domain-test:
    name: Format the domain test fixture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-expo-native-android

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Format the failing file
        run: pnpm exec prettier --write packages/domain/src/index.test.ts

      - name: Commit formatting only when changed
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- packages/domain/src/index.test.ts; then
            echo "The domain test file is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/domain/src/index.test.ts
          git commit -m "style: format domain tests"
          git push origin HEAD:refactor/remove-expo-native-android
