name: Android APK

on:
  workflow_dispatch:
    inputs:
      application:
        description: Mobile application
        type: choice
        options:
          - customer
          - pro
        default: customer
        required: true
      profile:
        description: Android build profile
        type: choice
        options:
          - dev
          - beta
          - production
        default: dev
        required: true
      version:
        description: App version (for example 1.2.3 or 1.2.3-beta.1)
        type: string
        default: "1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.application }} / ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Resolve pnpm lockfile for the native app dependencies
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Commit lockfile update to the selected branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized."
            exit 0
          fi

          if [ "$TARGET_BRANCH" = "main" ]; then
            echo "::error::The lockfile changed on main. Commit the lockfile update through a pull request before building from main."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: synchronize pnpm lockfile for native mobile apps"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare app environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > "$GITHUB_WORKSPACE/.env"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase credentials are not configured; this APK will use the app's mock mode."
          fi

      - name: Configure stable Android signing when repository secrets exist
        env:
          KEYSTORE_BASE64: ${{ secrets.BAMANASHOP_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BAMANASHOP_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAMANASHOP_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BAMANASHOP_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$KEYSTORE_PASSWORD"
            test -n "$KEY_ALIAS"
            test -n "$KEY_PASSWORD"
            KEYSTORE_FILE="$RUNNER_TEMP/bamanashop-upload.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            {
              echo "BAMANASHOP_KEYSTORE_FILE=$KEYSTORE_FILE"
              echo "BAMANASHOP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "BAMANASHOP_KEY_ALIAS=$KEY_ALIAS"
              echo "BAMANASHOP_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Stable signing keystore configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Persistent signing is not configured. The runner debug key will be used; updates from a later hosted run may require uninstalling the previous APK."
            echo "- Stable signing: not configured (runner debug key used)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Calculate version and select Android variant
        id: build_config
        env:
          APPLICATION: ${{ inputs.application }}
          PROFILE: ${{ inputs.profile }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION_CODE="$(node scripts/app-version.cjs "$APP_VERSION")"
          case "$PROFILE" in
            dev)
              GRADLE_TASK=":app:assembleDebug"
              APK_RELATIVE_PATH="app/build/outputs/apk/debug/app-debug.apk"
              EXPECTED_DEBUGGABLE="true"
              ;;
            beta|production)
              GRADLE_TASK=":app:assembleRelease"
              APK_RELATIVE_PATH="app/build/outputs/apk/release/app-release.apk"
              EXPECTED_DEBUGGABLE="false"
              ;;
            *)
              echo "::error::Unsupported build profile: $PROFILE"
              exit 1
              ;;
          esac

          if [ "$APPLICATION" = "customer" ]; then
            EXPECTED_APPLICATION_ID="com.bamanashop.customer"
          else
            EXPECTED_APPLICATION_ID="com.bamanashop.pro"
          fi

          {
            echo "version_code=$VERSION_CODE"
            echo "gradle_task=$GRADLE_TASK"
            echo "apk_relative_path=$APK_RELATIVE_PATH"
            echo "expected_debuggable=$EXPECTED_DEBUGGABLE"
            echo "expected_application_id=$EXPECTED_APPLICATION_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Build APK with native Gradle project
        id: gradle_build
        env:
          APPLICATION: ${{ inputs.application }}
          PROFILE: ${{ inputs.profile }}
          APP_VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ steps.build_config.outputs.version_code }}
          GRADLE_TASK: ${{ steps.build_config.outputs.gradle_task }}
          APK_RELATIVE_PATH: ${{ steps.build_config.outputs.apk_relative_path }}
          EXPECTED_DEBUGGABLE: ${{ steps.build_config.outputs.expected_debuggable }}
          EXPECTED_APPLICATION_ID: ${{ steps.build_config.outputs.expected_application_id }}
        run: |
          set -euo pipefail
          APP_DIR="apps/$APPLICATION"
          cd "$APP_DIR/android"

          gradle --no-daemon --stacktrace "$GRADLE_TASK" \
            "-PbamanashopVersionName=$APP_VERSION" \
            "-PbamanashopVersionCode=$VERSION_CODE"

          APK_SOURCE="app/$APK_RELATIVE_PATH"
          test -s "$APK_SOURCE"

          if ! unzip -Z1 "$APK_SOURCE" | grep -Fxq "assets/index.android.bundle"; then
            echo "::error::The APK does not contain assets/index.android.bundle; Metro bundling was skipped."
            exit 1
          fi

          ACTUAL_DEBUGGABLE="$(apkanalyzer manifest debuggable "$APK_SOURCE" | tr -d '\r')"
          if [ "$ACTUAL_DEBUGGABLE" != "$EXPECTED_DEBUGGABLE" ]; then
            echo "::error::Expected Android debuggable=$EXPECTED_DEBUGGABLE but got $ACTUAL_DEBUGGABLE."
            exit 1
          fi

          ACTUAL_APPLICATION_ID="$(apkanalyzer manifest application-id "$APK_SOURCE" | tr -d '\r')"
          if [ "$ACTUAL_APPLICATION_ID" != "$EXPECTED_APPLICATION_ID" ]; then
            echo "::error::Expected applicationId=$EXPECTED_APPLICATION_ID but got $ACTUAL_APPLICATION_ID."
            exit 1
          fi

          apksigner verify "$APK_SOURCE"

          OUTPUT_DIR="$RUNNER_TEMP/bamanashop-apk"
          mkdir -p "$OUTPUT_DIR"
          APK_NAME="BamanaShop-$APPLICATION-$PROFILE-v$APP_VERSION.apk"
          cp "$APK_SOURCE" "$OUTPUT_DIR/$APK_NAME"
          unzip -t "$OUTPUT_DIR/$APK_NAME" >/dev/null

          echo "apk_path=$OUTPUT_DIR/$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          {
            echo "### Android APK build"
            echo "- Application: $APPLICATION"
            echo "- Profile: $PROFILE"
            echo "- Version: $APP_VERSION"
            echo "- Android versionCode: $VERSION_CODE"
            echo "- Variant: $GRADLE_TASK"
            echo "- Application ID: $ACTUAL_APPLICATION_ID"
            echo "- Android debuggable: $ACTUAL_DEBUGGABLE"
            echo "- Embedded JS bundle: verified"
            echo "- Metro required at runtime: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.gradle_build.outputs.apk_path }}
          APPLICATION_ID: ${{ steps.build_config.outputs.expected_application_id }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r "$APK_PATH"
            adb shell monkey -p "$APPLICATION_ID" 1
            sleep 25

            APP_PID="$(adb shell pidof "$APPLICATION_ID" | tr -d '\r')"
            if [ -z "$APP_PID" ]; then
              adb logcat -d -t 500 > "$RUNNER_TEMP/android-startup.log"
              tail -n 160 "$RUNNER_TEMP/android-startup.log"
              echo "The installed application did not stay running after launch." >&2
              exit 1
            fi

            adb logcat -d --pid="$APP_PID" > "$RUNNER_TEMP/android-app.log"
            if grep -E "FATAL EXCEPTION|Unable to load script|Could not connect to development server|No bundle URL present" "$RUNNER_TEMP/android-app.log"; then
              echo "The app logged a startup or bundle-loading failure." >&2
              exit 1
            fi

            echo "ADB install and app process startup passed; the app was launched without a Metro server."

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamanashop-${{ inputs.application }}-android-${{ inputs.profile }}-v${{ inputs.version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/bamanashop-apk/*.apk
          if-no-files-found: ignore
          retention-days: 30
