name: One-time mobile formatting

on:
  push:
    branches:
      - refactor/remove-expo-native-android

permissions:
  contents: write

concurrency:
  group: one-time-mobile-formatting
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-expo-native-android
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format both native mobile projects
        run: |
          pnpm --filter=@bamanashop/customer exec prettier --write .
          pnpm --filter=@bamanashop/pro exec prettier --write .

      - name: Commit formatting changes to the feature branch
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- apps/customer apps/pro; then
            echo "Mobile projects were already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer apps/pro
          git commit -m "style: format native mobile projects"
          git push origin HEAD:refactor/remove-expo-native-android
