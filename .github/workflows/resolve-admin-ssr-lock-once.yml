name: One-time admin SSR lockfile sync

on:
  push:
    branches:
      - refactor/remove-expo-native-android

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-expo-native-android

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve the lockfile from workspace manifests
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen installation
        run: pnpm install --frozen-lockfile

      - name: Commit lockfile only when changed
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "The lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync lockfile for admin SSR dependency"
          git push origin HEAD:refactor/remove-expo-native-android
