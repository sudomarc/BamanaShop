name: CI

on:
  push:
    branches: [main, refactor/remove-expo-native-android]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug environment
        run: |
          echo "GITHUB_REF: ${{ github.ref }}"
          echo "GITHUB_SHA: ${{ github.sha }}"
          echo "RUNNER_OS: ${{ runner.os }}"
          echo "PWD: $(pwd)"
          ls -la

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Validate PNG assets
        run: pnpm run validate:png

      - name: Validate legacy storefront SEO
        run: node scripts/validate-seo.mjs

      - name: Build Admin
        run: pnpm --filter=@bamanashop/admin build