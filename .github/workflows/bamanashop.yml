name: BamanaShop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: "Manual action"
        type: choice
        options:
          - verify
          - build-android
          - build-ios
          - cleanup-legacy-history
        default: verify
      profile:
        description: "EAS build profile"
        type: choice
        options:
          - development
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: bamanashop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality checks
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'verify'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Customer Expo config
        working-directory: apps/customer
        run: |
          config_file="$RUNNER_TEMP/expo-config.json"
          error_file="$RUNNER_TEMP/expo-config.err"
          if ! pnpm exec expo config --json > "$config_file" 2> "$error_file"; then
            cat "$error_file" >&2
            cat "$config_file" >&2
            exit 1
          fi
          echo "Customer Expo config resolved successfully."
          rm -f "$config_file" "$error_file"

      # Shared packages have runnable lint, type, build and unit-test suites.
      - name: Build shared packages
        id: shared_build
        run: pnpm build:packages

      - name: Lint shared packages
        id: shared_lint
        run: pnpm --filter=@bamanashop/contracts lint && pnpm --filter=@bamanashop/domain lint

      - name: Check shared package formatting
        id: shared_format
        run: pnpm --filter=@bamanashop/contracts format:check

      - name: Typecheck shared packages
        id: shared_typecheck
        run: pnpm --filter=@bamanashop/contracts typecheck && pnpm --filter=@bamanashop/domain typecheck

      - name: Test shared packages
        id: shared_tests
        run: pnpm --filter=@bamanashop/contracts test && pnpm --filter=@bamanashop/domain test

      # Keep known app-level failures visible without blocking the verified
      # shared-package baseline. These are technical-debt signals, not passes.
      - name: Diagnose app lint
        id: app_lint
        continue-on-error: true
        run: pnpm lint

      - name: Diagnose app formatting
        id: app_format
        continue-on-error: true
        run: pnpm format:check

      - name: Diagnose app typecheck
        id: app_typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Diagnose app tests
        id: app_tests
        continue-on-error: true
        run: pnpm test

      - name: Diagnose Admin production build
        id: admin_build
        continue-on-error: true
        run: pnpm --filter=@bamanashop/admin build

      - name: Validate legacy storefront SEO
        id: seo
        run: node scripts/validate-seo.mjs

      - name: Report quality gate
        if: always()
        env:
          SHARED_BUILD: ${{ steps.shared_build.outcome }}
          SHARED_LINT: ${{ steps.shared_lint.outcome }}
          SHARED_FORMAT: ${{ steps.shared_format.outcome }}
          SHARED_TYPECHECK: ${{ steps.shared_typecheck.outcome }}
          SHARED_TESTS: ${{ steps.shared_tests.outcome }}
          SEO: ${{ steps.seo.outcome }}
          APP_LINT: ${{ steps.app_lint.outcome }}
          APP_FORMAT: ${{ steps.app_format.outcome }}
          APP_TYPECHECK: ${{ steps.app_typecheck.outcome }}
          APP_TESTS: ${{ steps.app_tests.outcome }}
          ADMIN_BUILD: ${{ steps.admin_build.outcome }}
        run: |
          failed=0
          for check in SHARED_BUILD SHARED_LINT SHARED_FORMAT SHARED_TYPECHECK SHARED_TESTS SEO; do
            result="${!check}"
            echo "${check}: ${result:-not-run}"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          echo
          echo "Application diagnostics (non-blocking until app issues are fixed):"
          for check in APP_LINT APP_FORMAT APP_TYPECHECK APP_TESTS ADMIN_BUILD; do
            echo "${check}: ${!check:-not-run}"
          done
          exit "$failed"

  rls:
    name: Supabase migration check
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'verify'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # All Supabase CLI commands must run from the same project directory.
      - name: Start local Supabase
        working-directory: supabase
        run: npx supabase start

      - name: Reset database and apply migrations
        working-directory: supabase
        run: npx supabase db reset --linked=false

      - name: Generate database types
        working-directory: supabase
        run: npx supabase gen types typescript --local > ../packages/contracts/src/database.generated.ts

  eas-build-android:
    name: EAS build (Android)
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'build-android'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        working-directory: apps/customer
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Validate Expo project configuration
        working-directory: apps/customer
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          if [[ ! "${EAS_PROJECT_ID:-}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Set the EAS_PROJECT_ID repository secret to the UUID of the Expo project."
            exit 1
          fi

          config_file="$RUNNER_TEMP/expo-config.json"
          error_file="$RUNNER_TEMP/expo-config.err"
          if ! pnpm exec expo config --json > "$config_file" 2> "$error_file"; then
            cat "$error_file" >&2
            sed "s/$EAS_PROJECT_ID/[redacted]/g" "$config_file" >&2
            exit 1
          fi
          EXPO_CONFIG_PATH="$config_file" node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.EXPO_CONFIG_PATH, "utf8"));
            if (config.extra?.eas?.projectId !== process.env.EAS_PROJECT_ID) {
              console.error("Resolved Expo config does not match EAS_PROJECT_ID.");
              process.exit(1);
            }
          '
          rm -f "$config_file" "$error_file"

      - name: Build Android app and wait for completion
        id: eas_build
        working-directory: apps/customer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          build_output="$RUNNER_TEMP/eas-build.json"
          eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait --json > "$build_output"

          BUILD_ID="$(node - "$build_output" <<'NODE'
          const fs = require("node:fs");
          const raw = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const builds = Array.isArray(raw) ? raw : [raw];
          if (builds.length !== 1 || !builds[0]?.id) {
            throw new Error("EAS did not return exactly one Android build with an ID.");
          }
          const build = builds[0];
          if (build.status !== "FINISHED" || !build.artifacts?.applicationArchiveUrl) {
            throw new Error(`EAS build did not finish successfully (status: ${build.status ?? "unknown"}).`);
          }
          process.stdout.write(build.id);
          NODE
          )"

          echo "EAS Android build finished: $BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Download completed Android APK
        working-directory: apps/customer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
          BUILD_ID: ${{ steps.eas_build.outputs.build_id }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          download_output="$RUNNER_TEMP/eas-download.json"
          eas build:download --build-id "$BUILD_ID" --json > "$download_output"

          APP_PATH="$(node - "$download_output" <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (typeof result.path !== "string" || result.path.length === 0) {
            throw new Error("EAS download did not return an application archive path.");
          }
          process.stdout.write(result.path);
          NODE
          )"

          test -f "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/bamanashop-apk"
          APK_PATH="$RUNNER_TEMP/bamanashop-apk/BamanaShop-$PROFILE.apk"
          cp "$APP_PATH" "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null
          echo "Verified APK: $APK_PATH"

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: bamanashop-android-${{ inputs.profile }}-${{ github.run_number }}
          path: ${{ runner.temp }}/bamanashop-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  eas-build-ios:
    name: EAS build (iOS)
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'build-ios'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        working-directory: apps/customer
        run: eas whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Validate Expo project configuration
        working-directory: apps/customer
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          if [[ ! "${EAS_PROJECT_ID:-}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Set the EAS_PROJECT_ID repository secret to the UUID of the Expo project."
            exit 1
          fi

          config_file="$RUNNER_TEMP/expo-config.json"
          error_file="$RUNNER_TEMP/expo-config.err"
          if ! pnpm exec expo config --json > "$config_file" 2> "$error_file"; then
            cat "$error_file" >&2
            sed "s/$EAS_PROJECT_ID/[redacted]/g" "$config_file" >&2
            exit 1
          fi
          EXPO_CONFIG_PATH="$config_file" node -e '
            const fs = require("node:fs");
            const config = JSON.parse(fs.readFileSync(process.env.EXPO_CONFIG_PATH, "utf8"));
            if (config.extra?.eas?.projectId !== process.env.EAS_PROJECT_ID) {
              console.error("Resolved Expo config does not match EAS_PROJECT_ID.");
              process.exit(1);
            }
          '
          rm -f "$config_file" "$error_file"

      - name: Queue EAS build
        working-directory: apps/customer
        run: eas build --platform ios --profile "${{ inputs.profile }}" --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

  cleanup-legacy-history:
    name: Delete runs from retired workflows
    if: (github.event_name == 'workflow_dispatch' && inputs.task == 'cleanup-legacy-history') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete legacy workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = [];
            let page = 1;

            // Fetch every page before deleting; deletion changes page offsets.
            while (true) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              runs.push(...response.data.workflow_runs);
              if (
                response.data.workflow_runs.length < 100 ||
                runs.length >= response.data.total_count
              ) break;
              page += 1;
            }

            const previousRuns = runs.filter((run) =>
              run.id !== context.runId &&
              run.path?.startsWith(".github/workflows/")
            );

            for (const run of previousRuns) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              core.info("Deleted " + run.id + ": " + run.name + " (" + run.path + ")");
            }

            await core.summary
              .addHeading("Legacy workflow history cleanup")
              .addRaw("Deleted " + previousRuns.length + " previous repository workflow run(s). The run performing this cleanup and GitHub Pages system runs were kept.")
              .write();
