name: BamanaShop

on:
  push:
    branches: [chore/single-bamanashop-workflow, refactor/remove-expo-native-android]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      application:
        description: Android application
        type: choice
        options: [customer, pro]
        default: customer
        required: true
      profile:
        description: APK profile
        type: choice
        options: [dev, beta, production]
        default: dev
        required: true
      version:
        description: App version (for example 1.2.3)
        type: string
        default: "1.0.0"
        required: true
      clean_history:
        description: Delete all previous GitHub Actions runs and keep this run
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: bamanashop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-history:
    name: One-time Actions history cleanup
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[cleanup-history]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.clean_history)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Cancel and delete all previous workflow runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = context.runId;
            const runs = [];
            let page = 1;

            while (true) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });
              runs.push(...response.data.workflow_runs);
              if (response.data.workflow_runs.length < 100) break;
              page += 1;
            }

            core.info("Found " + runs.length + " existing run(s); preserving current run " + currentRunId + ".");
            let deleted = 0;
            const failures = [];

            for (const run of runs) {
              if (run.id === currentRunId) continue;

              try {
                let status = run.status;

                if (status !== "completed") {
                  try {
                    await github.rest.actions.cancelWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id,
                    });
                  } catch (error) {
                    core.warning("Cancel " + run.id + ": " + error.message);
                  }

                  for (let attempt = 0; attempt < 60; attempt += 1) {
                    const latest = await github.rest.actions.getWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id,
                    });
                    status = latest.data.status;
                    if (status === "completed") break;
                    await new Promise(resolve => setTimeout(resolve, 2000));
                  }
                }

                if (status !== "completed") {
                  throw new Error("Run " + run.id + " did not reach completed state.");
                }

                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted += 1;
                core.info("Deleted run " + run.id + ": " + run.name);
              } catch (error) {
                failures.push(run.id + ": " + error.message);
                core.error("Could not delete run " + run.id + ": " + error.message);
              }
            }

            await core.summary
              .addHeading("Actions history cleanup")
              .addRaw("Deleted " + deleted + " previous run(s). Preserved current run " + currentRunId + ".")
              .write();

            if (failures.length > 0) {
              core.setFailed(failures.length + " run(s) could not be deleted:\n" + failures.join("\n"));
            }

  quality:
    name: Quality checks
    needs: cleanup-history
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Validate PNG assets
        run: pnpm run validate:png

      - name: Validate legacy storefront SEO
        run: node scripts/validate-seo.mjs

      - name: Build Admin
        run: pnpm --filter=@bamanashop/admin build

  supabase:
    name: Supabase migration verification
    needs: cleanup-history
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Supabase CLI
        run: |
          CLI_VERSION="$(./supabase/node_modules/.bin/supabase --version)"
          test "$CLI_VERSION" = "2.122.1"

      - name: Start local Supabase
        run: ./supabase/node_modules/.bin/supabase start

      - name: Reset database and apply migrations
        run: ./supabase/node_modules/.bin/supabase db reset --local

      - name: Generate local database types
        run: ./supabase/node_modules/.bin/supabase gen types typescript --local > "$RUNNER_TEMP/database.generated.ts"

      - name: Verify generated types
        run: |
          test -s "$RUNNER_TEMP/database.generated.ts"
          grep -q "export type Database" "$RUNNER_TEMP/database.generated.ts"

  build-android:
    name: Build Android APK
    needs: cleanup-history
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      - name: Prepare mobile Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
          } > "$GITHUB_WORKSPACE/.env.mobile"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase client values are missing; backend-dependent features may not work."
          fi

      - name: Configure Android signing when secrets are available
        env:
          KEYSTORE_BASE64: ${{ secrets.BAMANASHOP_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BAMANASHOP_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAMANASHOP_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BAMANASHOP_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$KEYSTORE_PASSWORD"
            test -n "$KEY_ALIAS"
            test -n "$KEY_PASSWORD"
            KEYSTORE_FILE="$RUNNER_TEMP/bamanashop-upload.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            {
              echo "BAMANASHOP_KEYSTORE_FILE=$KEYSTORE_FILE"
              echo "BAMANASHOP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "BAMANASHOP_KEY_ALIAS=$KEY_ALIAS"
              echo "BAMANASHOP_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Persistent Android signing is not configured; the Gradle debug key will be used where applicable."
          fi

      - name: Calculate build configuration
        id: config
        env:
          APPLICATION: ${{ inputs.application }}
          PROFILE: ${{ inputs.profile }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(node scripts/app-version.cjs "$APP_VERSION")"

          case "$PROFILE" in
            dev)
              GRADLE_TASK=":app:assembleDebug"
              APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
              EXPECTED_DEBUGGABLE="true"
              ;;
            beta|production)
              GRADLE_TASK=":app:assembleRelease"
              APK_PATH="app/build/outputs/apk/release/app-release.apk"
              EXPECTED_DEBUGGABLE="false"
              ;;
            *)
              echo "::error::Unsupported profile: $PROFILE"
              exit 1
              ;;
          esac

          case "$APPLICATION" in
            customer) APPLICATION_ID="com.bamanashop.customer" ;;
            pro) APPLICATION_ID="com.bamanashop.pro" ;;
            *) echo "::error::Unsupported application: $APPLICATION"; exit 1 ;;
          esac

          {
            echo "version_code=$VERSION_CODE"
            echo "gradle_task=$GRADLE_TASK"
            echo "apk_path=$APK_PATH"
            echo "expected_debuggable=$EXPECTED_DEBUGGABLE"
            echo "application_id=$APPLICATION_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Build APK with the checked-in native Gradle project
        env:
          APPLICATION: ${{ inputs.application }}
          APP_VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ steps.config.outputs.version_code }}
          GRADLE_TASK: ${{ steps.config.outputs.gradle_task }}
        run: |
          set -euo pipefail
          cd "apps/$APPLICATION/android"
          ./gradlew --no-daemon --stacktrace "$GRADLE_TASK" \
            "-PbamanashopVersionName=$APP_VERSION" \
            "-PbamanashopVersionCode=$VERSION_CODE"

      - name: Verify standalone APK
        env:
          APPLICATION: ${{ inputs.application }}
          PROFILE: ${{ inputs.profile }}
          APP_VERSION: ${{ inputs.version }}
          APK_PATH: apps/${{ inputs.application }}/android/${{ steps.config.outputs.apk_path }}
          EXPECTED_DEBUGGABLE: ${{ steps.config.outputs.expected_debuggable }}
          EXPECTED_APPLICATION_ID: ${{ steps.config.outputs.application_id }}
        run: |
          set -euo pipefail
          test -s "$APK_PATH"

          unzip -Z1 "$APK_PATH" | grep -Fxq "assets/index.android.bundle" || {
            echo "::error::The APK has no embedded JavaScript bundle."
            exit 1
          }

          ACTUAL_DEBUGGABLE="$(apkanalyzer manifest debuggable "$APK_PATH" | tr -d '\r')"
          test "$ACTUAL_DEBUGGABLE" = "$EXPECTED_DEBUGGABLE"

          ACTUAL_APPLICATION_ID="$(apkanalyzer manifest application-id "$APK_PATH" | tr -d '\r')"
          test "$ACTUAL_APPLICATION_ID" = "$EXPECTED_APPLICATION_ID"

          apksigner verify "$APK_PATH"
          unzip -t "$APK_PATH" >/dev/null

          mkdir -p "$RUNNER_TEMP/bamanashop-apk"
          cp "$APK_PATH" "$RUNNER_TEMP/bamanashop-apk/BamanaShop-$APPLICATION-$PROFILE-v$APP_VERSION.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bamanashop-${{ inputs.application }}-${{ inputs.profile }}-v${{ inputs.version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/bamanashop-apk/*.apk
          if-no-files-found: error
          retention-days: 30
