name: BamanaShop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "APK build profile"
        type: choice
        options:
          - dev
          - beta
          - production
        default: beta
        required: true
      version:
        description: "App version (1.2.3, 1.2.3-beta.1, or dev.test-0.1)"
        type: string
        default: "1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: bamanashop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality checks
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Customer Expo config
        working-directory: apps/customer
        run: |
          config_file="$RUNNER_TEMP/expo-config.json"
          error_file="$RUNNER_TEMP/expo-config.err"
          if ! pnpm exec expo config --json > "$config_file" 2> "$error_file"; then
            cat "$error_file" >&2
            cat "$config_file" >&2
            exit 1
          fi
          echo "Customer Expo config resolved successfully."
          rm -f "$config_file" "$error_file"

      - name: Validate Customer PNG assets
        working-directory: apps/customer
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const files = [
            "assets/images/icon.png",
            "assets/images/splash-icon.png",
            "assets/images/notification-icon.png",
            "assets/images/favicon.png",
          ];
          const signature = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);

          for (const file of files) {
            const image = readFileSync(file);
            if (!image.subarray(0, signature.length).equals(signature)) {
              throw new Error(file + " is not a valid PNG file.");
            }
          }
          console.log("Validated " + files.length + " PNG assets.");
          NODE

      - name: Build shared packages
        id: shared_build
        run: pnpm build:packages

      - name: Lint shared packages
        id: shared_lint
        run: pnpm --filter=@bamanashop/contracts lint && pnpm --filter=@bamanashop/domain lint

      - name: Check shared package formatting
        id: shared_format
        run: pnpm --filter=@bamanashop/contracts format:check

      - name: Typecheck shared packages
        id: shared_typecheck
        run: pnpm --filter=@bamanashop/contracts typecheck && pnpm --filter=@bamanashop/domain typecheck

      - name: Test shared packages
        id: shared_tests
        run: pnpm --filter=@bamanashop/contracts test && pnpm --filter=@bamanashop/domain test

      - name: Diagnose app lint
        id: app_lint
        continue-on-error: true
        run: pnpm lint

      - name: Diagnose app formatting
        id: app_format
        continue-on-error: true
        run: pnpm format:check

      - name: Diagnose app typecheck
        id: app_typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Diagnose app tests
        id: app_tests
        continue-on-error: true
        run: pnpm test

      - name: Diagnose Admin production build
        id: admin_build
        continue-on-error: true
        run: pnpm --filter=@bamanashop/admin build

      - name: Validate legacy storefront SEO
        id: seo
        run: node scripts/validate-seo.mjs

      - name: Report quality gate
        if: always()
        env:
          SHARED_BUILD: ${{ steps.shared_build.outcome }}
          SHARED_LINT: ${{ steps.shared_lint.outcome }}
          SHARED_FORMAT: ${{ steps.shared_format.outcome }}
          SHARED_TYPECHECK: ${{ steps.shared_typecheck.outcome }}
          SHARED_TESTS: ${{ steps.shared_tests.outcome }}
          SEO: ${{ steps.seo.outcome }}
          APP_LINT: ${{ steps.app_lint.outcome }}
          APP_FORMAT: ${{ steps.app_format.outcome }}
          APP_TYPECHECK: ${{ steps.app_typecheck.outcome }}
          APP_TESTS: ${{ steps.app_tests.outcome }}
          ADMIN_BUILD: ${{ steps.admin_build.outcome }}
        run: |
          failed=0
          for check in SHARED_BUILD SHARED_LINT SHARED_FORMAT SHARED_TYPECHECK SHARED_TESTS SEO; do
            result="${!check}"
            echo "${check}: ${result:-not-run}"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          echo
          echo "Application diagnostics (non-blocking until app issues are fixed):"
          for check in APP_LINT APP_FORMAT APP_TYPECHECK APP_TESTS ADMIN_BUILD; do
            echo "${check}: ${!check:-not-run}"
          done
          exit "$failed"

  rls:
    name: Supabase migration check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Start local Supabase
        working-directory: supabase
        run: npx supabase start

      - name: Reset database and apply migrations
        working-directory: supabase
        run: npx supabase db reset --linked=false

      - name: Generate database types
        working-directory: supabase
        run: npx supabase gen types typescript --local > ../packages/contracts/src/database.generated.ts

  build-android:
    name: Build Android APK (${{ inputs.profile }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version and calculate Android versionCode
        id: version
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          version_code="$(node scripts/app-version.cjs "$APP_VERSION")"
          echo "android_version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"
          echo "Android versionCode: $version_code"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate native Android project
        working-directory: apps/customer
        env:
          BAMANASHOP_BUILD_PROFILE: ${{ inputs.profile }}
          BAMANASHOP_VERSION: ${{ inputs.version }}
          BAMANASHOP_ANDROID_VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
          EXPO_NO_TELEMETRY: "1"
        run: CI=1 pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build APK with Gradle
        env:
          BAMANASHOP_BUILD_PROFILE: ${{ inputs.profile }}
          BAMANASHOP_VERSION: ${{ inputs.version }}
          BAMANASHOP_ANDROID_VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
        run: |
          set -euo pipefail

          case "$BAMANASHOP_BUILD_PROFILE" in
            dev)
              gradle_task="assembleDebug"
              apk_source="app/build/outputs/apk/debug/app-debug.apk"
              ;;
            beta|production)
              gradle_task="assembleRelease"
              apk_source="app/build/outputs/apk/release/app-release.apk"
              ;;
            *)
              echo "::error::Unsupported build profile: $BAMANASHOP_BUILD_PROFILE"
              exit 1
              ;;
          esac

          cd apps/customer/android
          ./gradlew --no-daemon --stacktrace ":app:$gradle_task"

          test -s "$apk_source"
          mkdir -p "$RUNNER_TEMP/bamanashop-apk"
          apk_name="BamanaShop-$BAMANASHOP_BUILD_PROFILE-v$BAMANASHOP_VERSION.apk"
          cp "$apk_source" "$RUNNER_TEMP/bamanashop-apk/$apk_name"
          unzip -t "$RUNNER_TEMP/bamanashop-apk/$apk_name" >/dev/null
          echo "Verified APK: $apk_name"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bamanashop-android-${{ inputs.profile }}-v${{ inputs.version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/bamanashop-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summarize build
        env:
          PROFILE: ${{ inputs.profile }}
          APP_VERSION: ${{ inputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
        run: |
          {
            echo "### BamanaShop Android APK"
            echo "- Profile: $PROFILE"
            echo "- App version: $APP_VERSION"
            echo "- Android versionCode: $ANDROID_VERSION_CODE"
            echo "- Artifact: bamanashop-android-$PROFILE-v$APP_VERSION-${{ github.run_number }}"
            if [ "$PROFILE" = "dev" ]; then
              echo "- Build type: Debug (requires the Metro development server to load the JavaScript bundle)."
            else
              echo "- Build type: Release."
            fi
            echo "- Build engine: local Gradle on GitHub Actions; no EAS cloud build."
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-history:
    name: Delete previous workflow runs
    needs: [verify, rls, build-android]
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove previous completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = [];
            let page = 1;

            while (true) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });

              runs.push(...response.data.workflow_runs);
              if (
                response.data.workflow_runs.length < 100 ||
                runs.length >= response.data.total_count
              ) break;
              page += 1;
            }

            const previousRuns = runs.filter((run) =>
              run.id !== context.runId &&
              run.status === "completed" &&
              run.path?.startsWith(".github/workflows/")
            );

            for (const run of previousRuns) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
              core.info("Deleted " + run.id + ": " + run.name + " (" + run.path + ")");
            }

            await core.summary
              .addHeading("Workflow history cleanup")
              .addRaw("Deleted " + previousRuns.length + " previous completed repository workflow run(s). The current run and runs not associated with repository workflow files were kept.")
              .write();
