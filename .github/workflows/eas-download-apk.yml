name: Download EAS Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID (from eas build --no-wait output)'
        required: true
        type: string
      platform:
        description: 'Platform'
        type: choice
        options:
          - android
          - ios
        default: 'android'

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}

jobs:
  download-apk:
    name: Download APK from EAS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo
        run: eas login --token $EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download build artifact
        id: download
        run: |
          echo "Downloading build artifact for build ID: ${{ github.event.inputs.build_id }}"
          eas build:download --platform ${{ github.event.inputs.platform }} --id ${{ github.event.inputs.build_id }} --output ./apk
          ls -la ./apk/

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: eas-apk-${{ github.event.inputs.build_id }}
          path: ./apk/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.event.inputs.platform == 'android'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.event.inputs.build_id }}
          name: BamanaShop Android APK - Build ${{ github.event.inputs.build_id }}
          body: |
            BamanaShop Customer App - Android APK

            EAS Build ID: ${{ github.event.inputs.build_id }}
            Platform: Android

            ## Installation
            ```bash
            adb install bamanashop-android.apk
            ```
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output APK info
        run: |
          echo "✅ APK downloaded and available:"
          echo "   - Workflow artifact: eas-apk-${{ github.event.inputs.build_id }}"
          echo "   - GitHub Release: build-${{ github.event.inputs.build_id }}"