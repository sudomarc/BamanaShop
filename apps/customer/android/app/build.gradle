apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

project.ext.envConfigFiles = [
    debug: "../../.env.mobile",
    release: "../../.env.mobile"
]
apply from: project(":react-native-config").projectDir.getPath() + "/dotenv.gradle"

def stableKeystoreFile = System.getenv("BAMANASHOP_KEYSTORE_FILE")
def hasStableSigning = stableKeystoreFile != null && file(stableKeystoreFile).exists()
def appVersionCode = (project.findProperty("bamanashopVersionCode") ?: "1").toInteger()
def appVersionName = project.findProperty("bamanashopVersionName") ?: "1.0.0"

react {
    root = file("../..")
    entryFile = file("../../index.js")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")
    debuggableVariants = []
    autolinkLibrariesWithApp()
}

android {
    namespace "com.bamanashop.customer"
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.bamanashop.customer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        resValue "string", "app_name", "BamanaShop"
    }

    signingConfigs {
        stable {
            if (hasStableSigning) {
                storeFile file(stableKeystoreFile)
                storePassword System.getenv("BAMANASHOP_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BAMANASHOP_KEY_ALIAS")
                keyPassword System.getenv("BAMANASHOP_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig hasStableSigning ? signingConfigs.stable : signingConfigs.debug
        }
        release {
            debuggable false
            signingConfig hasStableSigning ? signingConfigs.stable : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    }
}
